<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta confirmada – Sistema de Préstamos de Computadoras – IEN</title>
<style>
  :root {
    --violeta: #5B2A86;
    --violeta-oscuro: #3D1A5B;
    --amarillo: #F5B700;
    --crema: #F5F0E8;
    --gris: #6B6B6B;
    --lavanda: #EDE6F5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--crema);
    color: var(--violeta-oscuro);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  header {
    background: linear-gradient(135deg, var(--violeta), var(--violeta-oscuro));
    color: #fff;
    text-align: center;
    padding: 28px 16px;
    border-bottom: 6px solid var(--amarillo);
  }
  header h1 {
    margin: 0;
    font-size: clamp(1rem, 4.2vw, 1.35rem);
    font-weight: 600;
    line-height: 1.3;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: var(--lavanda);
    border-radius: 20px;
    padding: 32px 24px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 16px rgba(61, 26, 91, 0.12);
  }
  .check {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--amarillo);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 40px; height: 40px; }
  h2 {
    margin: 0 0 12px;
    font-size: clamp(1.5rem, 7vw, 2rem);
    color: var(--violeta);
  }
  p {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.5;
    color: var(--gris);
  }
  footer {
    text-align: center;
    font-size: .8rem;
    color: var(--gris);
    padding: 16px;
  }
</style>
</head>
<body>
  <header>
    <h1>Sistema de Préstamos de Computadoras – IEN</h1>
  </header>
  <main>
    <section class="card">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3D1A5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h2>¡Cuenta confirmada!</h2>
      <p>Ya podés volver a la app e iniciar sesión.</p>
    </section>
  </main>
  <footer>IEN</footer>
</body>
</html>
