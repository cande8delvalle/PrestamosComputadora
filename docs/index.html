<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta confirmada – Sistema de Préstamos de Computadoras</title>
<style>
  :root {
    --violeta: #5B2A86;
    --violeta-oscuro: #2C1253;
    --amarillo: #F5B700;
    --crema: #F5F0EA;
    --lila: #EDE6F5;
    --texto: #3A3345;
    --gris: #6F6878;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--crema);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.55;
  }
  header {
    background: #fff;
    border-bottom: 4px solid var(--amarillo);
    padding: 20px 24px;
    display: flex;
    justify-content: center;
  }
  header img { height: 64px; width: auto; display: block; }
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px 56px;
  }
  .tarjeta {
    background: #fff;
    width: 100%;
    max-width: 560px;
    border-radius: 24px;
    padding: 48px 36px 40px;
    box-shadow: 0 8px 30px rgba(44, 18, 83, .10);
    text-align: center;
  }
  .check {
    width: 88px; height: 88px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: var(--amarillo);
    display: grid; place-items: center;
  }
  .check svg { width: 44px; height: 44px; }
  h1 {
    color: var(--violeta);
    font-size: 2rem;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .lead { font-size: 1.1rem; color: var(--gris); }
  .lead + .lead { margin-top: 8px; }
  footer {
    text-align: center;
    padding: 24px 20px 32px;
    font-size: .85rem;
    color: var(--gris);
  }
  @media (max-width: 480px) {
    header img { height: 52px; }
    main { padding: 28px 16px 40px; }
    .tarjeta { padding: 36px 22px 32px; border-radius: 20px; }
    h1 { font-size: 1.65rem; }
      }
</style>
</head>
<body>
  <header>
    <img src="logo.svg" alt="Instituto de Educación – IEN">
  </header>

  <main>
    <section class="tarjeta">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2C1253" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h1>¡Cuenta confirmada!</h1>
      <p class="lead">Tu correo quedó verificado y tu cuenta ya está activa.</p>
      <p class="lead">Ya podés volver a la app e iniciar sesión.</p>

    </section>
  </main>

  <footer>Sistema de Préstamos de Computadoras · IEN</footer>
</body>
</html>
